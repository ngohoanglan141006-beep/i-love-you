<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>Gửi em yêu ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  body {
    min-height: 100vh; overflow: hidden; background: #080812;
    color: #fff; font-family: "Segoe UI", Arial, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .falling {
    position: fixed; top: -70px; left: 50%; z-index: 2;
    transform: translateX(-50%);
    color: #ff4f9a; font-weight: 800; letter-spacing: 3px;
    font-size: clamp(20px, 5vw, 34px);
    text-shadow: 0 0 8px #ff3c91, 0 0 22px #ff3c91;
    white-space: nowrap; pointer-events: none;
    animation: fall 4.8s linear infinite;
  }
  .falling:nth-of-type(2) { animation-delay: 1.6s; left: 25%; font-size: clamp(14px, 3.5vw, 23px); }
  .falling:nth-of-type(3) { animation-delay: 3.2s; left: 76%; font-size: clamp(14px, 3.5vw, 23px); }
  @keyframes fall {
    0% { top: -70px; opacity: 0; }
    12% { opacity: 1; }
    85% { opacity: 1; }
    100% { top: 110vh; opacity: 0; }
  }
  .message {
    position: fixed; z-index: 3; left: 50%; top: 51%;
    transform: translate(-50%, -50%);
    width: min(78vw, 360px); text-align: center;
    padding: 14px 12px; border-radius: 14px;
    background: rgba(8, 8, 18, .45);
    text-shadow: 0 0 8px #ff3c91, 0 0 18px #ff3c91;
    pointer-events: none;
  }
  .message h1 {
    margin: 0 0 10px; color: #ff8fbd;
    font-size: clamp(19px, 4.8vw, 28px); line-height: 1.25;
  }
  .message p {
    margin: 0; color: #fff; font-size: clamp(15px, 3.8vw, 20px);
    line-height: 1.45; font-weight: 600;
  }
  .tap {
    position: fixed; z-index: 4; bottom: 18px; left: 0; right: 0;
    text-align: center; color: rgba(255,190,220,.7);
    font-size: 12px; letter-spacing: .5px;
  }
  @media (max-height: 560px) {
    .message { top: 52%; width: min(70vw, 320px); }
    .message h1 { font-size: 18px; }
    .message p { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<div class="falling">I LOVE YOU ❤️</div>
<div class="falling">I LOVE YOU 💗</div>
<div class="falling">I LOVE YOU 💖</div>

<div class="message">
  <h1>Yêu dấu của chị</h1>
  <p>Chúc em 19-11 thật hạnh phúc. Mong em luôn biết yêu thương bản thân và nhớ rằng có một người yêu em rất nhiều.</p>
</div>
<div class="tap">Dành tặng em yêu ❤️</div>

<script>
(() => {
  const canvas = document.getElementById('heart');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, particles = [];
  const pinks = ['#ff2f88', '#ff559e', '#ff78b4', '#ff9bc8', '#ffd0e4'];

  function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x: x * scale, y: y * scale };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createParticles();
  }
  function createParticles() {
    particles = [];
    const scale = Math.min(w * 0.018, h * 0.014, 10.5);
    const cx = w / 2, cy = h * 0.53;
    const count = Math.max(900, Math.min(1900, Math.floor(w * h / 520)));
    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      const edge = heartPoint(t, scale);
      const fill = Math.sqrt(Math.random());
      const jitter = (Math.random() - .5) * 5;
      particles.push({
        x: cx + edge.x * fill + jitter,
        y: cy + edge.y * fill + jitter,
        baseX: cx + edge.x * fill + jitter,
        baseY: cy + edge.y * fill + jitter,
        r: Math.random() * 1.65 + .45,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * .025 + .006,
        color: pinks[Math.floor(Math.random() * pinks.length)],
        alpha: Math.random() * .65 + .3
      });
    }
    // A brighter, denser outline gives the heart its sparkling silhouette.
    for (let i = 0; i < 600; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = heartPoint(t, scale * (1 + (Math.random() - .5) * .035));
      particles.push({
        x: cx + p.x, y: cy + p.y, baseX: cx + p.x, baseY: cy + p.y,
        r: Math.random() * 1.8 + .6, phase: Math.random() * 6.28,
        speed: Math.random() * .03 + .01,
        color: pinks[Math.floor(Math.random() * pinks.length)],
        alpha: Math.random() * .7 + .3
      });
    }
  }
  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    tick += 1;
    const beat = 1 + Math.sin(tick * .035) * .018;
    const cx = w / 2, cy = h * .53;
    for (const p of particles) {
      const dx = (p.baseX - cx) * (beat - 1);
      const dy = (p.baseY - cy) * (beat - 1);
      const shimmer = .55 + .45 * Math.sin(tick * p.speed + p.phase);
      ctx.globalAlpha = p.alpha * shimmer;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 7;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.baseX + dx, p.baseY + dy, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
</body>
</html>
